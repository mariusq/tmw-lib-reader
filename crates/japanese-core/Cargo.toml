[package]
name = "tmw-japanese-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
lindera = { version = "=5.3.0", features = ["embed-ipadic"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
unicode-normalization = "0.1.24"
zip = { version = "2.2.2", default-features = false, features = ["deflate"], optional = true }
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }

[features]
default = ["tokenizer"]
tokenizer = ["dep:lindera"]
yomitan = ["dep:zip", "dep:rusqlite", "dep:image"]

[dev-dependencies]
tempfile = "3.14.0"
