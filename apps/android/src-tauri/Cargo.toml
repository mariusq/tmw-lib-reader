[package]
name = "tmw-android"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tmw_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tmw-japanese-core = { path = "../../../crates/japanese-core" }

[dev-dependencies]
tempfile = "3.14.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
